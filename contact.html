</head>
<body>

  <header>
    <nav class="nav-left">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>

    <div class="logo">MM</div>
    <nav class="nav-right">

      <a href="contact.html" class="active">Contact</a>
    </nav>
    <button class="hamburger" id="hamburger" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </header>

  <nav class="mobile-nav" id="mobileNav">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="experience.html">Experience</a>
    <a href="contact.html">Contact</a>
  </nav>

  <section class="contact-page">
    <div class="contact-wrapper">
      <p class="section-tag">Get In Touch</p>
      <h1>Contact Me</h1>
      <p>Open to internships, collaborations, freelance, and new ideas. Don't hesitate to reach out.</p>

      <div class="contact-channels">
        <a class="ch-item" href="mailto:molnmark04@gmail.com">
          <i class="fas fa-envelope"></i>molnmark04@gmail.com
        </a>
        <a class="ch-item" href="tel:+31621845236">
          <i class="fas fa-phone"></i>+31 6 2184 5236
        </a>
        <a class="ch-item" href="https://wa.me/36707766307" target="_blank">
          <i class="fab fa-whatsapp"></i>WhatsApp
        </a>
        <a class="ch-item" href="https://linkedin.com/in/molnmark04" target="_blank">
          <i class="fab fa-linkedin"></i>LinkedIn
        </a>
      </div>

      <div class="contact-form">
        <h2>// Send a message</h2>
        <form action="https://formspree.io/f/xpwpwqyd" method="POST">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="_replyto" placeholder="your@email.com" required>
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Hi Márk, I'd love to discuss..." required></textarea>
          </div>
          <button type="submit" class="btn" style="width:100%;justify-content:center;">
            Send Message <i class="fas fa-paper-plane" style="margin-left:6px;font-size:11px;"></i>
          </button>
        </form>
      </div>
    </div>
  </section>

  <footer>

  </footer>

  <script>
    document.getElementById('hamburger').addEventListener('click', () => {
      document.getElementById('mobileNav').classList.toggle('open');
    });

</body>
</html>
